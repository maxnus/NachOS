[project]
name = "sc2nachos"
dynamic = ["version"]
description = "NachOS — an event-driven StarCraft II bot API for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Max Nusspickel", email = "max.nusspickel@gmail.com" }]
keywords = ["StarCraft", "StarCraft 2", "StarCraft II", "AI", "Bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pys2clientprotocol>=1.0.2",
    "websocket-client>=1.9",
    "numpy>=2.1",
    "scipy>=1.14",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/maxnus/nachOS"
Repository = "https://github.com/maxnus/nachOS"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sc2nachos/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sc2nachos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs StarCraft II installed, and starts it"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
    "ignore::DeprecationWarning:s2clientprotocol.*",
]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
# protobuf ships type stubs without inline source; nothing to fix on our side.
reportMissingModuleSource = false

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
# Laid out by `tools/generate_tech_tree.py`, which keeps a mapping's brace beside its parenthesis.
exclude = ["src/sc2nachos/gamedata/_techtree/_build_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# What the tech tree holds for one ability goes on one line, however long.
"src/sc2nachos/gamedata/_techtree/_build_*.py" = ["E501"]
