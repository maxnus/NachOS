[project]
name = "sc2nachos"
dynamic = ["version"]
description = "NachOS — an event-driven StarCraft II bot API for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Max Nusspickel", email = "max.nusspickel@gmail.com" }]
keywords = ["StarCraft", "StarCraft 2", "StarCraft II", "AI", "Bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pys2clientprotocol>=1.0.2",
    "websocket-client>=1.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "semita>=0.2.1",
    "loguru>=0.7",
]

[project.urls]
Homepage = "https://github.com/maxnus/NachOS"
Repository = "https://github.com/maxnus/NachOS"
Documentation = "https://maxnus.github.io/NachOS/"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pdoc>=15",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the git tag: a release is made by tagging, `v0.1.0` building 0.1.0, never by editing a file, and a
# commit after it builds a dev version of the next. The fallback is for a copy of the source without git.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# Written at every build and editable install, and not tracked, so that `sc2nachos.__version__` reads without git.
[tool.hatch.build.hooks.vcs]
version-file = "src/sc2nachos/__about__.py"
template = '''
# Written by hatch-vcs from the git tag at build time; not tracked.
__version__ = "{version}"
'''

[tool.hatch.build.targets.wheel]
packages = ["src/sc2nachos"]

# What builds the wheel and runs the tests, which read data/, tools/ and examples/; without the maps, 33 MB, or what
# only this repository's CI and agents use.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/data", "/tools", "/examples", "/docs", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs StarCraft II installed, and starts it"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
    "ignore::DeprecationWarning:s2clientprotocol.*",
]

[tool.pyright]
include = ["src", "tests", "tools", "examples", ".github/match"]
# Pyright's default skips every folder named with a dot, .github/match among them; this keeps the rest of the default.
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git"]
pythonVersion = "3.12"
# protobuf ships type stubs without inline source; nothing to fix on our side.
reportMissingModuleSource = false

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
# Laid out by `tools/generate_tech_tree.py`, which keeps a mapping's brace beside its parenthesis.
exclude = ["src/sc2nachos/gamedata/_techtree/_build_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen, so one made as a default argument is safe to share between calls.
extend-immutable-calls = [
    "sc2nachos.GameTime",
    "sc2nachos.gametime.GameTime",
    "sc2nachos.gametime._game_time.GameTime",
]

[tool.ruff.lint.per-file-ignores]
# What the tech tree holds for one ability goes on one line, however long.
"src/sc2nachos/gamedata/_techtree/_build_*.py" = ["E501"]
