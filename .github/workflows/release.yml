name: release

# Publishing a GitHub release puts its tag on PyPI, and then its reference on GitHub Pages: `v0.1.0` uploads sc2nachos
# 0.1.0 and publishes its reference, and a pre-release `v0.2.0rc1` uploads 0.2.0rc1 and leaves the reference as it
# is. The build reads the version from the tag. A tag that is not `v` and the version as PyPI writes it, or a release
# marked a pre-release whose version is not one, or the other way round, fails before anything is uploaded.
#
# PyPI takes the upload from this workflow, in the `pypi` environment, alone; the environment is where to require an
# approval before it. docs/maintaining/releasing.md says how to set both up. PyPI never takes a version twice, even
# once it is deleted, so a broken release is followed by the next version, never replaced.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      MARKED_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and its tags, because the version is read from the tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Nothing an earlier run cached goes into what is uploaded.
          enable-cache: false

      - name: Install
        run: uv sync --locked --extra dev

      - name: Build
        run: uv build

      # A tag the build does not read as it is, or a checkout changed since it, gives other file names.
      - name: Check the version is the tag's
        run: |
          version="${TAG#v}"
          if [ "$version" = "$TAG" ]; then
            echo "::error::The tag $TAG does not start with v. Name the release's tag v and the version, as v0.1.0."
            exit 1
          fi
          for file in "dist/sc2nachos-$version-py3-none-any.whl" "dist/sc2nachos-$version.tar.gz"; do
            if [ ! -f "$file" ]; then
              echo "::error::The tag $TAG built $(ls dist | tr '\n' ' ')rather than $file."
              exit 1
            fi
          done
          # In the form PyPI writes, which the file names have just shown the version to be in, a pre-release, as
          # 0.2.0rc1, and a dev version are the only ones with an a, b, rc or dev part.
          version_is_prerelease=false
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+ ]]; then version_is_prerelease=true; fi
          if [ "$MARKED_PRERELEASE" = true ] && [ "$version_is_prerelease" = false ]; then
            echo "::error::The release is marked a pre-release, but $version is not one, as 0.2.0rc1 is."
            exit 1
          fi
          if [ "$MARKED_PRERELEASE" = false ] && [ "$version_is_prerelease" = true ]; then
            echo "::error::$version is a pre-release, but the release is not marked one."
            exit 1
          fi

      - name: Test
        run: uv run pytest -n 4

      - name: Keep the build for the upload
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sc2nachos/
    permissions:
      # PyPI's trusted publishing takes the upload on this workflow's word, with no token stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Only once PyPI has it, so that the reference describes a version pip installs.
  reference:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/api-reference.yml
